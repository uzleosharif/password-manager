name: C++ CI

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create and use docker-container builder
        run: |
          docker buildx create --driver docker-container --use --name ci-builder

      - name: Use default buildx instance
        run: docker buildx inspect --bootstrap

      - name: Restore Docker build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build cpp-modules-base image
        run: |
          docker buildx build \
            --load \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            -f dockers/cpp-modules-base/cpp_modules_base.dockerfile \
            -t cpp-modules-base:v1.0.0 \
            .

      - name: Move new Docker cache into place
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build final image with libsodium
        run: |
          docker build \
            -f dockers/password-manager.dockerfile \
            -t cpp-final \
            .

      - name: Run build and tests inside container
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work \
            -e LD_LIBRARY_PATH="/modules/lib/:/modules/lib/uzleo" \
            cpp-final \
            bash -c "cd test && modi && ninja -f build/build.ninja && ./build/upm_tests"

