name: C++ CI

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cpp-modules-base image
        run: |
          docker build -f dockers/cpp-modules-base/cpp_modules_base.dockerfile -t cpp-modules-base:v1.0.0 .

      - name: Build final image with libsodium
        run: |
          docker build -f dockers/password-manager.dockerfile -t cpp-final .

      - name: Run build and tests inside container
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work \
            -e LD_LIBRARY_PATH="/modules/lib/:/modules/lib/uzleo" \
            cpp-final \
            bash -c "modi && ninja -f build/build.ninja"

